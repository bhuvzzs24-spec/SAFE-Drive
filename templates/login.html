<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Operator sign in | SAFE-Drive</title><script src="{{ url_for('static',filename='theme.js') }}" defer></script><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='workspace.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='access.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='premium.css') }}"></head>
<body class="access-page"><main class="surface-card access-card"><a class="access-wordmark" href="/#home" aria-label="SAFE-Drive home">SAFE<span>·</span>DRIVE</a><p class="eyebrow">Operator workspace</p><h1>A clearer view.<br>Welcome back.</h1><p>Sign in to access private analyses and review evidence. The public sample view stays read-only.</p>
{% if error %}<p role="alert" class="job-error" id="login-error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="40"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button class="button button-primary" type="submit">Sign in</button></form><a href="/">Return to public sample view</a></main></body></html>
