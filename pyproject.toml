[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-drive-research"
version = "0.3.0"
description = "Calibrated, auditable traffic-video safety analytics research toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8", "ultralytics>=8.2", "deep-sort-realtime>=1.3"]
ocr = ["easyocr>=1.7"]
web = ["Flask>=3.0"]

[project.scripts]
safe-drive = "safe_drive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
